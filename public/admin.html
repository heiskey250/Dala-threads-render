<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dala Threads — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--gold:#c9a84c;--gold-light:#e8c97a;--deep:#0f0820;--surface:#160d2a;--surface2:#1e1235;--rose:#8b2252;--text:#f5ede0;--muted:rgba(245,237,224,.55);--border:rgba(201,168,76,.18);--ok:#3ddc97;--warn:#f5b942;--bad:#ff6b6b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Jost',sans-serif;background:var(--deep);color:var(--text);min-height:100vh}
button,input,select,textarea{font-family:inherit;color:inherit}
h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:600}
.hidden{display:none!important}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 30% 20%,#2a1650,var(--deep) 60%)}
.card{background:linear-gradient(160deg,var(--surface),var(--surface2));border:1px solid var(--border);border-radius:18px;padding:28px}
#login .card{width:min(380px,100%)}
#login h1{font-size:2rem;color:var(--gold-light);margin-bottom:4px}
#login p.sub{color:var(--muted);font-size:.85rem;margin-bottom:20px}
label{display:block;font-size:.7rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:12px 0 5px}
input,select,textarea{width:100%;background:rgba(201,168,76,.07);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:.9rem;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
select option{background:var(--surface);color:var(--text)}
textarea{resize:vertical;min-height:90px}
.btn{background:linear-gradient(135deg,var(--gold),var(--gold-light));color:#1a1030;border:0;border-radius:10px;padding:10px 18px;font-weight:600;cursor:pointer;font-size:.85rem;transition:.2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(201,168,76,.25)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid rgba(255,107,107,.4)}
.btn.sm{padding:6px 11px;font-size:.75rem}
.err{color:var(--bad);font-size:.82rem;margin-top:10px;min-height:1em}
/* layout */
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--surface);border-right:1px solid var(--border);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
aside .brand{font-family:'Cormorant Garamond',serif;font-size:1.5rem;color:var(--gold-light);padding:0 10px 18px}
aside .brand small{display:block;font-family:'Jost';font-size:.62rem;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}
.nav{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;cursor:pointer;color:var(--muted);font-size:.9rem;border:0;background:none;text-align:left;width:100%}
.nav:hover{background:rgba(201,168,76,.08);color:var(--text)}
.nav.active{background:rgba(201,168,76,.15);color:var(--gold-light)}
.nav .dot{margin-left:auto;background:var(--rose);color:#fff;font-size:.65rem;border-radius:20px;padding:1px 7px}
aside .spacer{flex:1}
main{padding:28px clamp(16px,3vw,40px);min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.top h2{font-size:1.9rem;color:var(--gold-light)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row input,.row select{width:auto;min-width:150px}
/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
.stat{padding:18px}
.stat .n{font-family:'Cormorant Garamond',serif;font-size:2rem;color:var(--gold-light)}
.stat .l{font-size:.7rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card h3{font-size:1.2rem;margin-bottom:12px;color:var(--gold-light)}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:14px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th{font-size:.66rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);text-align:left;padding:12px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid rgba(201,168,76,.07);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:rgba(201,168,76,.05)}
.thumb{width:42px;height:42px;border-radius:9px;object-fit:cover;background:var(--surface2);display:grid;place-items:center;color:var(--muted)}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.7rem;font-weight:500;background:rgba(201,168,76,.15);color:var(--gold-light);text-transform:capitalize}
.pill.ok{background:rgba(61,220,151,.15);color:var(--ok)}.pill.warn{background:rgba(245,185,66,.15);color:var(--warn)}.pill.bad{background:rgba(255,107,107,.15);color:var(--bad)}
.stock{width:70px;padding:6px 8px}
.muted{color:var(--muted)}.right{text-align:right}
.detail td{background:rgba(0,0,0,.18)}
.detail ul{list-style:none;margin:6px 0 10px}.detail li{padding:3px 0}
/* modal */
.modal{position:fixed;inset:0;background:rgba(5,2,12,.7);display:grid;place-items:center;padding:16px;z-index:50;backdrop-filter:blur(4px)}
.modal .card{width:min(560px,100%);max-height:92vh;overflow-y:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:.88rem;text-transform:none;letter-spacing:0;color:var(--text)}
.check input{width:auto}
.msg{padding:14px;border-bottom:1px solid var(--border);cursor:pointer}.msg:hover{background:rgba(201,168,76,.05)}
.msg.new b::after{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--rose);margin-left:8px}
#toast{position:fixed;bottom:22px;right:22px;background:var(--surface2);border:1px solid var(--gold);border-radius:12px;padding:12px 18px;z-index:99;box-shadow:0 14px 40px rgba(0,0,0,.5);transition:.3s;transform:translateY(80px);opacity:0}
#toast.show{transform:none;opacity:1}
@media(max-width:860px){#app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:12px}aside .brand,aside .spacer{display:none}.grid2,.two{grid-template-columns:1fr}.nav{width:auto}}
</style>
</head>
<body>

<section id="login">
  <div class="card">
    <h1>Dala Threads</h1>
    <p class="sub">Admin dashboard — sign in to manage your shop.</p>
    <form id="loginForm">
      <label>Email</label><input type="email" id="lEmail" required autocomplete="username">
      <label>Password</label><input type="password" id="lPass" required autocomplete="current-password">
      <div class="err" id="lErr"></div>
      <button class="btn" style="width:100%;margin-top:6px">Sign in</button>
    </form>
  </div>
</section>

<div id="app" class="hidden">
  <aside>
    <div class="brand">Dala Threads<small>Admin</small></div>
    <button class="nav active" data-view="overview"><i class="fa-solid fa-chart-line"></i> Overview</button>
    <button class="nav" data-view="products"><i class="fa-solid fa-bag-shopping"></i> Products</button>
    <button class="nav" data-view="orders"><i class="fa-solid fa-box"></i> Orders <span class="dot hidden" id="dotOrders"></span></button>
    <button class="nav" data-view="messages"><i class="fa-solid fa-envelope"></i> Messages <span class="dot hidden" id="dotMsgs"></span></button>
    <button class="nav" data-view="customers"><i class="fa-solid fa-users"></i> Customers</button>
    <div class="spacer"></div>
    <a class="nav" href="/index.html"><i class="fa-solid fa-store"></i> View shop</a>
    <button class="nav" id="logout"><i class="fa-solid fa-right-from-bracket"></i> Sign out</button>
  </aside>
  <main id="view"></main>
</div>
<div id="toast"></div>

<script>
const API = '/api';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const frw = (n) => Number(n || 0).toLocaleString() + ' FRW';
const date = (d) => new Date(d).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
let token = localStorage.getItem('dtAdminToken');
let current = 'overview';
const ORDER_STATUSES = ['pending', 'confirmed', 'processing', 'shipped', 'delivered', 'cancelled'];

async function api(path, { method = 'GET', body, form } = {}) {
  const headers = token ? { Authorization: 'Bearer ' + token } : {};
  if (body) headers['Content-Type'] = 'application/json';
  const res = await fetch(API + path, { method, headers, body: form || (body ? JSON.stringify(body) : undefined) });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { signOut(); throw new Error(data.message || 'Session expired'); }
  if (!res.ok) throw new Error(data.message || 'Request failed');
  return data;
}
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 3200); }
const guard = (fn) => async (...a) => { try { await fn(...a); } catch (e) { toast(e.message); } };
function imgSrc(p) { if (!p.image) return ''; return /^(\/|https?:)/.test(p.image) ? p.image : '/' + p.image; }
const thumb = (p) => p.image ? `<img class="thumb" src="${esc(imgSrc(p))}" alt="" onerror="this.outerHTML='<div class=thumb><i class=&quot;fa-solid fa-bag-shopping&quot;></i></div>'">` : '<div class="thumb"><i class="fa-solid fa-bag-shopping"></i></div>';
const statusPill = (s) => `<span class="pill ${{ delivered: 'ok', confirmed: 'ok', paid: 'ok', replied: 'ok', cancelled: 'bad', failed: 'bad', pending: 'warn', unpaid: 'warn', new: 'warn' }[s] || ''}">${esc(s)}</span>`;

// ── auth ──
$('loginForm').onsubmit = async (e) => {
  e.preventDefault(); $('lErr').textContent = '';
  try {
    const res = await fetch(API + '/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: $('lEmail').value, password: $('lPass').value }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message);
    if (data.user.role !== 'admin') throw new Error('This account is not an administrator.');
    token = data.token; localStorage.setItem('dtAdminToken', token); start();
  } catch (err) { $('lErr').textContent = err.message; }
};
function signOut() { token = null; localStorage.removeItem('dtAdminToken'); if (es) es.close(); $('app').classList.add('hidden'); $('login').classList.remove('hidden'); }
$('logout').onclick = signOut;

// ── navigation + live updates ──
let es;
document.querySelectorAll('.nav[data-view]').forEach((b) => b.onclick = () => show(b.dataset.view));
function show(v) {
  current = v;
  document.querySelectorAll('.nav[data-view]').forEach((b) => b.classList.toggle('active', b.dataset.view === v));
  guard(views[v])();
}
async function start() {
  try { await api('/admin/stats'); } catch { return; }
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  show('overview'); refreshBadges();
  if (es) es.close();
  es = new EventSource(`${API}/events?token=${encodeURIComponent(token)}`);
  es.addEventListener('order:new', (e) => { const d = JSON.parse(e.data); toast(`New order ${d.orderNumber} — ${frw(d.total)}`); refreshBadges(); if (['overview', 'orders'].includes(current)) show(current); });
  es.addEventListener('message:new', (e) => { toast(`New message from ${JSON.parse(e.data).name}`); refreshBadges(); if (current === 'messages') show('messages'); });
  es.addEventListener('payment:reference', (e) => { toast(`MoMo reference received for ${JSON.parse(e.data).orderNumber}`); if (current === 'orders') show('orders'); });
}
async function refreshBadges() {
  try {
    const s = await api('/admin/stats');
    $('dotOrders').textContent = s.pendingOrders; $('dotOrders').classList.toggle('hidden', !s.pendingOrders);
    $('dotMsgs').textContent = s.newMessages; $('dotMsgs').classList.toggle('hidden', !s.newMessages);
  } catch {}
}

const views = {
  async overview() {
    const s = await api('/admin/stats');
    $('view').innerHTML = `
      <div class="top"><h2>Overview</h2></div>
      <div class="stats">
        <div class="card stat"><div class="n">${frw(s.revenue)}</div><div class="l">Paid revenue</div></div>
        <div class="card stat"><div class="n">${s.totalOrders}</div><div class="l">Orders</div></div>
        <div class="card stat"><div class="n">${s.pendingOrders}</div><div class="l">Pending orders</div></div>
        <div class="card stat"><div class="n">${s.customers}</div><div class="l">Customers</div></div>
        <div class="card stat"><div class="n">${s.products}</div><div class="l">Active products</div></div>
        <div class="card stat"><div class="n">${s.newMessages}</div><div class="l">Unread messages</div></div>
      </div>
      <div class="grid2">
        <div class="card"><h3>Recent orders</h3>${s.recentOrders.length ? `<table><tbody>${s.recentOrders.map((o) => `<tr><td>${esc(o.orderNumber)}<div class="muted">${esc(o.user ? o.user.firstName + ' ' + o.user.lastName : '')}</div></td><td>${statusPill(o.status)}</td><td class="right">${frw(o.total)}</td></tr>`).join('')}</tbody></table>` : '<p class="muted">No orders yet.</p>'}</div>
        <div class="card"><h3>Low stock</h3>${s.lowStock.length ? `<table><tbody>${s.lowStock.map((p) => `<tr><td>${thumb(p)}</td><td>${esc(p.name)}</td><td class="right">${p.stock === 0 ? '<span class="pill bad">Sold out</span>' : `<span class="pill warn">${p.stock} left</span>`}</td></tr>`).join('')}</tbody></table>` : '<p class="muted">Everything is well stocked.</p>'}</div>
      </div>`;
  },

  async products() {
    const q = $('pSearch') ? $('pSearch').value : '';
    const [{ products }, { categories }] = await Promise.all([api(`/products?limit=100&includeInactive=true&search=${encodeURIComponent(q)}`), api('/categories')]);
    window._cats = categories; window._products = products;
    $('view').innerHTML = `
      <div class="top"><h2>Products</h2><div class="row"><input id="pSearch" placeholder="Search…" value="${esc(q)}"><button class="btn" onclick="productForm()"><i class="fa-solid fa-plus"></i> Add product</button></div></div>
      <div class="tw"><table><thead><tr><th></th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th></th></tr></thead><tbody>
      ${products.map((p) => `<tr>
        <td>${thumb(p)}</td><td>${esc(p.name)}<div class="muted">#${p.number}${p.badge ? ' · ' + esc(p.badge) : ''}${p.featured ? ' · ★ featured' : ''}</div></td>
        <td>${esc(p.category && p.category.name)}</td><td>${frw(p.price)}</td>
        <td><input class="stock" type="number" min="0" value="${p.stock}" onchange="setStock('${p._id}',this)"></td>
        <td>${p.active ? '<span class="pill ok">Active</span>' : '<span class="pill">Hidden</span>'}</td>
        <td class="right"><button class="btn ghost sm" onclick="productForm('${p._id}')">Edit</button> <button class="btn danger sm" onclick="delProduct('${p._id}')">Delete</button></td></tr>`).join('')}
      </tbody></table></div>`;
    let t; $('pSearch').oninput = () => { clearTimeout(t); t = setTimeout(() => { const v = $('pSearch').value; views.products().then(() => { const i = $('pSearch'); i.focus(); i.setSelectionRange(v.length, v.length); }); }, 350); };
  },

  async orders() {
    const status = window._ostatus || '';
    const { orders } = await api(`/orders?limit=100${status ? '&status=' + status : ''}`);
    $('view').innerHTML = `
      <div class="top"><h2>Orders</h2><select id="oFilter"><option value="">All statuses</option>${ORDER_STATUSES.map((s) => `<option ${s === status ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
      <div class="tw"><table><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Payment</th><th>Status</th><th>Placed</th></tr></thead><tbody>
      ${orders.length ? orders.map((o) => `
        <tr class="click" onclick="toggleDetail('${o._id}')"><td><b>${esc(o.orderNumber)}</b></td>
        <td>${esc(o.user ? o.user.firstName + ' ' + o.user.lastName : o.shippingAddress.fullName)}</td><td>${frw(o.total)}</td>
        <td>${statusPill(o.paymentStatus)}<div class="muted">${esc(o.paymentMethod)}</div></td>
        <td onclick="event.stopPropagation()"><select onchange="setStatus('${o._id}',this.value)" ${['cancelled'].includes(o.status) ? 'disabled' : ''}>${ORDER_STATUSES.map((s) => `<option ${s === o.status ? 'selected' : ''}>${s}</option>`).join('')}</select></td>
        <td class="muted">${date(o.createdAt)}</td></tr>
        <tr class="detail hidden" id="d-${o._id}"><td colspan="6">
          <ul>${o.items.map((i) => `<li>${i.quantity} × ${esc(i.name)} — ${frw(i.price * i.quantity)}</li>`).join('')}</ul>
          <div class="muted">Deliver to: ${esc(o.shippingAddress.fullName)}, ${esc(o.shippingAddress.address)}${o.shippingAddress.city ? ', ' + esc(o.shippingAddress.city) : ''} · ${esc(o.shippingAddress.phone || (o.user && o.user.phone) || 'no phone')}${o.shippingAddress.notes ? '<br>Note: ' + esc(o.shippingAddress.notes) : ''}</div>
          ${o.payment ? `<div style="margin-top:10px">Payment: ${statusPill(o.payment.status)} ${o.payment.reference ? 'MoMo ref <b>' + esc(o.payment.reference) + '</b>' : '<span class="muted">no reference sent yet</span>'}
            ${['pending', 'failed'].includes(o.payment.status) && o.status !== 'cancelled' ? ` <button class="btn sm" onclick="setPayment('${o.payment._id}','confirmed')">Confirm payment</button>` : ''}
            ${o.payment.status === 'confirmed' ? ` <button class="btn ghost sm" onclick="setPayment('${o.payment._id}','refunded')">Mark refunded</button>` : ''}</div>` : ''}
        </td></tr>`).join('') : '<tr><td colspan="6" class="muted">No orders found.</td></tr>'}
      </tbody></table></div>`;
    $('oFilter').onchange = (e) => { window._ostatus = e.target.value; show('orders'); };
  },

  async messages() {
    const { messages } = await api('/messages?limit=100');
    window._messages = messages;
    $('view').innerHTML = `<div class="top"><h2>Messages</h2></div>
      <div class="tw">${messages.length ? messages.map((m) => `<div class="msg ${m.status === 'new' ? 'new' : ''}" onclick="openMessage('${m._id}')">
        <div class="row" style="justify-content:space-between"><b>${esc(m.name)}</b><span class="muted">${date(m.createdAt)}</span></div>
        <div class="muted">${esc(m.email)} · ${esc(m.subject)} · ${statusPill(m.status)}</div>
        <div style="margin-top:6px">${esc(m.message.slice(0, 140))}${m.message.length > 140 ? '…' : ''}</div></div>`).join('') : '<p class="muted" style="padding:20px">No messages yet.</p>'}</div>`;
  },

  async customers() {
    const { users } = await api('/admin/users');
    $('view').innerHTML = `<div class="top"><h2>Customers</h2></div>
      <div class="tw"><table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Joined</th><th>Status</th></tr></thead><tbody>
      ${users.map((u) => `<tr><td>${esc(u.firstName)} ${esc(u.lastName)}</td><td>${esc(u.email)}</td><td>${esc(u.phone || '—')}</td><td>${statusPill(u.role)}</td><td class="muted">${date(u.createdAt)}</td>
        <td>${u.role === 'admin' ? '<span class="muted">—</span>' : `<button class="btn ${u.isActive ? 'ghost' : ''} sm" onclick="toggleUser('${u._id}',${!u.isActive})">${u.isActive ? 'Deactivate' : 'Activate'}</button>`}</td></tr>`).join('')}
      </tbody></table></div>`;
  },
};

// ── actions ──
window.toggleDetail = (id) => $('d-' + id).classList.toggle('hidden');
window.setStatus = guard(async (id, status) => { await api(`/orders/${id}/status`, { method: 'PATCH', body: { status } }); toast('Order updated'); refreshBadges(); show('orders'); });
window.setPayment = guard(async (id, status) => { await api(`/payments/${id}`, { method: 'PATCH', body: { status } }); toast('Payment ' + status); refreshBadges(); show('orders'); });
window.toggleUser = guard(async (id, isActive) => { await api(`/admin/users/${id}`, { method: 'PATCH', body: { isActive } }); show('customers'); });
window.setStock = guard(async (id, input) => { await api(`/products/${id}/stock`, { method: 'PATCH', body: { stock: +input.value } }); toast('Stock updated'); });
window.delProduct = guard(async (id) => { if (!confirm('Delete this product permanently?')) return; await api('/products/' + id, { method: 'DELETE' }); toast('Product deleted'); show('products'); });

function modal(html) { const m = document.createElement('div'); m.className = 'modal'; m.innerHTML = `<div class="card">${html}</div>`; m.onclick = (e) => { if (e.target === m) m.remove(); }; document.body.appendChild(m); return m; }

window.productForm = (id) => {
  const p = id ? window._products.find((x) => x._id === id) : { active: true, stock: 10 };
  const m = modal(`<h3>${id ? 'Edit product' : 'Add product'}</h3>
    <form id="pForm">
      <label>Name</label><input name="name" required value="${esc(p.name)}">
      <div class="two"><div><label>Price (FRW)</label><input name="price" type="number" min="0" required value="${p.price ?? ''}"></div><div><label>Stock</label><input name="stock" type="number" min="0" required value="${p.stock}"></div></div>
      <div class="two"><div><label>Category</label><input name="category" list="cats" required value="${esc(p.category ? p.category.slug : '')}" placeholder="bag, purse, clutch…"><datalist id="cats">${(window._cats || []).map((c) => `<option value="${esc(c.slug)}">${esc(c.name)}</option>`).join('')}</datalist></div><div><label>Badge</label><input name="badge" value="${esc(p.badge || '')}" placeholder="New, Bridal…"></div></div>
      <label>Description</label><textarea name="description">${esc(p.description || '')}</textarea>
      <label>Photo</label><input type="file" name="imageFile" accept="image/jpeg,image/png,image/webp">
      <label>…or image file name</label><input name="image" value="${esc(p.image || '')}" placeholder="bag51.jpg">
      <label class="check"><input type="checkbox" name="featured" ${p.featured ? 'checked' : ''}> Featured on the homepage</label>
      <label class="check"><input type="checkbox" name="active" ${p.active ? 'checked' : ''}> Visible in the shop</label>
      <div class="err" id="pErr"></div>
      <div class="row" style="margin-top:14px;justify-content:flex-end"><button type="button" class="btn ghost" onclick="this.closest('.modal').remove()">Cancel</button><button class="btn">Save</button></div>
    </form>`);
  m.querySelector('#pForm').onsubmit = async (e) => {
    e.preventDefault();
    const f = e.target, fd = new FormData();
    for (const k of ['name', 'price', 'stock', 'category', 'badge', 'description', 'image']) fd.append(k, f[k].value);
    fd.append('featured', f.featured.checked); fd.append('active', f.active.checked);
    if (f.imageFile.files[0]) fd.append('image', f.imageFile.files[0]);   // an uploaded photo wins over the typed name
    try { await api(id ? '/products/' + id : '/products', { method: id ? 'PUT' : 'POST', form: fd }); m.remove(); toast('Product saved'); show('products'); }
    catch (err) { $('pErr').textContent = err.message; }
  };
};

window.openMessage = guard(async (id) => {
  const msg = window._messages.find((x) => x._id === id);
  if (msg.status === 'new') { await api(`/messages/${id}/read`, { method: 'PATCH' }); refreshBadges(); }
  const m = modal(`<h3>${esc(msg.name)}</h3>
    <p class="muted">${esc(msg.email)}${msg.phone ? ' · ' + esc(msg.phone) : ''} · ${esc(msg.subject)} · ${date(msg.createdAt)}</p>
    <p style="margin:14px 0;white-space:pre-wrap">${esc(msg.message)}</p>
    ${msg.reply && msg.reply.text ? `<div class="card" style="padding:14px"><span class="muted">Your reply · ${date(msg.reply.at)}</span><p style="white-space:pre-wrap;margin-top:6px">${esc(msg.reply.text)}</p></div>` : ''}
    <label>${msg.reply && msg.reply.text ? 'Send another reply' : 'Reply'}</label><textarea id="rText"></textarea>
    <div class="err" id="rErr"></div>
    <div class="row" style="margin-top:12px;justify-content:space-between">
      <div class="row"><a class="btn ghost sm" href="mailto:${esc(msg.email)}?subject=Dala%20Threads">Email</a>${msg.phone ? `<a class="btn ghost sm" target="_blank" href="https://wa.me/${esc(msg.phone.replace(/\D/g, ''))}">WhatsApp</a>` : ''}<button class="btn danger sm" id="rDel">Delete</button></div>
      <div class="row"><button class="btn ghost" onclick="this.closest('.modal').remove()">Close</button><button class="btn" id="rSend">Save reply</button></div>
    </div>
    <p class="muted" style="font-size:.75rem;margin-top:10px">Saved replies show in the customer's account. To reach a visitor right now, use the Email or WhatsApp buttons.</p>`);
  m.querySelector('#rSend').onclick = async () => { try { await api(`/messages/${id}/reply`, { method: 'POST', body: { text: $('rText').value } }); m.remove(); toast('Reply saved'); show('messages'); refreshBadges(); } catch (e) { $('rErr').textContent = e.message; } };
  m.querySelector('#rDel').onclick = async () => { if (!confirm('Delete this message?')) return; await api('/messages/' + id, { method: 'DELETE' }); m.remove(); show('messages'); refreshBadges(); };
});

if (token) start();
</script>
</body>
</html>
